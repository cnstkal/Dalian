const CLOUDINARY_CLOUD = 'dbljkloal';
const CLOUDINARY_PRESET = 'Everything';

// 이미지를 리사이즈한 뒤 Cloudinary에 업로드하고 URL만 반환 (Firestore에는 URL 문자열만 저장됨)
const uploadImage = async (file, maxWidth=800) => {
 const resizedDataUrl = await resizeImage(file, maxWidth);
 const blob = await (await fetch(resizedDataUrl)).blob();
 const form = new FormData();
 form.append('file', blob);
 form.append('upload_preset', CLOUDINARY_PRESET);
 const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, { method: 'POST', body: form });
 if (!res.ok) throw new Error('Cloudinary 업로드 실패');
 const json = await res.json();
 return json.secure_url;
};

const resizeImage = (file, maxWidth=800) => new Promise((resolve) => {
 const reader = new FileReader();
 reader.readAsDataURL(file);
 reader.onload = (event) => {
  const img = new Image();
  img.src = event.target.result;
  img.onload = () => {
   const canvas = document.createElement('canvas');
   const ratio = maxWidth / img.width;
   canvas.width = maxWidth;
   canvas.height = img.height * (ratio > 1 ? 1 : ratio);
   canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
   resolve(canvas.toDataURL('image/jpeg', 0.6));
  };
 };
});

 const [start, setStart] = useState(false);

  if (start) t = setTimeout(callback, ms); else clearTimeout(t);
  return () => clearTimeout(t);
 }, [callback, ms, start]);
 return {
  onTouchStart: () => setStart(true), onTouchEnd: () => setStart(false), onTouchMove: () => setStart(false),
  onMouseDown: () => setStart(true), onMouseUp: () => setStart(false), onMouseLeave: () => setStart(false),
 };
};

const CNY_RATE = 210;
const formatCnyRange = (v) => {
 if (v === undefined || v === null || v === '') return '';
 const parts = String(v).split('~').map(s => Number(String(s).replace(/[^0-9.]/g, ''))).filter(n => !isNaN(n) && String(n)!=='');
 if (parts.length === 0) return '';
 const toWon = (n) => Math.round(n * CNY_RATE).toLocaleString();
 if (parts.length >= 2 && parts[1]) {
  return `${parts[0].toLocaleString()}~${parts[1].toLocaleString()}위안 (${toWon(parts[0])}~${toWon(parts[1])}원)`;
 }
 return `${parts[0].toLocaleString()}위안 (${toWon(parts[0])}원)`;
};

const ItineraryView = ({ data, updateData, apiKey, places }) => {
 const [activeDayIdx, setActiveDayIdx] = useState(0);
 const [loadingAI, setLoadingAI] = useState(false);
 const [locatingGPS, setLocatingGPS] = useState(false);
 const activeDay = data.days[activeDayIdx];

 const useCurrentLoc = !!data.useCurrentLocation;
 const originAddress = useCurrentLoc ? (data.currentLocation || '') : (data.hotelAddress || '');
 const originLabel = useCurrentLoc ? '현재 위치' : '호텔';

 const setCurrentLocationText = (val) => updateData({ ...data, currentLocation: val });
 const toggleUseCurrentLoc = () => updateData({ ...data, useCurrentLocation: !useCurrentLoc });

 const grabGPS = () => {
  if (!navigator.geolocation) return alert('이 기기/브라우저는 위치 확인을 지원하지 않아요.');
  setLocatingGPS(true);
  navigator.geolocation.getCurrentPosition(
   (pos) => {
    const { latitude, longitude } = pos.coords;
    updateData({ ...data, currentLocation: `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`, useCurrentLocation: true });
    setLocatingGPS(false);
   },
   (err) => { alert('위치를 가져오지 못했어요: ' + err.message); setLocatingGPS(false); },
   { enableHighAccuracy: true, timeout: 10000 }
  );
 };

 const addDay = () => {
  const newDays = [...data.days, { id: generateId(), label:`${data.days.length+1}일차`, destinations:[] }];
  updateData({ ...data, days:newDays });
  setActiveDayIdx(newDays.length - 1);
 };

 const deleteDay = (idx) => {
  if (data.days.length <= 1) return alert("최소 1개의 일차가 필요합니다.");
  if (confirm(`${data.days[idx].label} 일정을 삭제하시겠습니까?`)) {
   const newDays = data.days.filter((_, i) => i !== idx);
   newDays.forEach((day, i) => day.label = `${i+1}일차`);
   updateData({ ...data, days:newDays });
   setActiveDayIdx(Math.max(0, idx-1));
  }
 };

 const addDestination = () => {
  const newDays = [...data.days];
  newDays[activeDayIdx].destinations.push({ id: generateId(), name:'', address:'', time:'', aiPrediction:'', aiDuration:'', aiCost:'' });
  updateData({ ...data, days:newDays });
 };

 const updateDestination = (destId, field, value) => {
  const newDays = [...data.days];
  const dest = newDays[activeDayIdx].destinations.find(d => d.id === destId);
  if (dest) dest[field] = value;
  updateData({ ...data, days:newDays });
 };

 const removeDestination = (destId) => {
  const newDays = [...data.days];
  newDays[activeDayIdx].destinations = newDays[activeDayIdx].destinations.filter(d => d.id !== destId);
  updateData({ ...data, days:newDays });
 };

 const applyPlace = (destId, placeId) => {
  const p = (places||[]).find(p => p.id === placeId);
  if (!p) return;
  const newDays = [...data.days];
  const dest = newDays[activeDayIdx].destinations.find(d => d.id === destId);
  if (dest) { dest.name = p.name; dest.address = p.address || ''; }
  updateData({ ...data, days:newDays });
 };

 const predictTravel = async (destId) => {
  if (!apiKey) return alert("우측 상단 톱니바퀴에서 AI(Gemini) API 키를 먼저 입력해주세요.");
  if (!originAddress) return alert(`${originLabel} 주소를 먼저 입력해주세요.`);
  const dest = activeDay.destinations.find(d => d.id === destId);
  if (!dest || !dest.address) return alert("목적지 주소를 입력해주세요.");
  setLoadingAI(destId);
  try {
   const prompt = `출발지(${originLabel}) 주소: ${originAddress}, 목적지 주소: ${dest.address}. 중국 대련(Dalian) 여행 중입니다. 이 두 장소 간 택시나 대중교통 이용 시 대략적인 소요 시간과 예상 비용을 예측해주세요. 반드시 아래 JSON 형식으로만 답하고, 다른 텍스트나 마크다운 코드블록은 절대 포함하지 마세요.
{"duration":"약 15분 (택시 기준)","cost":"약 8,000원 (40위안)","tip":"이동수단 관련 짧은 팁 1줄, 없으면 빈 문자열"}`;
   const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
   });
   const result = await response.json();
   if (!response.ok || result.error) throw new Error(result.error?.message || `HTTP ${response.status}`);
   let text = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
   text = text.replace(/```json/g, '').replace(/```/g, '').trim();
   try {
    const parsed = JSON.parse(text);
    const newDays = [...data.days];
    const d = newDays[activeDayIdx].destinations.find(d => d.id === destId);
    if (d) { d.aiDuration = parsed.duration || ''; d.aiCost = parsed.cost || ''; d.aiPrediction = parsed.tip || ''; }
    updateData({ ...data, days:newDays });
   } catch (parseErr) {
    updateDestination(destId, 'aiDuration', text.replace(/\*\*/g, '').replace(/\*/g, ''));
   }
  } catch (e) { alert("AI 예측 중 오류: " + e.message); }
  setLoadingAI(false);
 };

 return (

 };

 const [editUploading, setEditUploading] = useState(false);

 const handleEditImageUpload = async (e) => {

         <span className="text-gray-400 text-xs">~</span>
         <input type="number" inputMode="numeric" placeholder="최대금액(위안)" value={editPlace.priceRange.split('~')[1]||''} onChange={(e) => setEditPlace({...editPlace, priceRange: (editPlace.priceRange.split('~')[0]||'') + '~' + e.target.value})} className="w-1/2 bg-gray-50 p-3 rounded-lg text-sm outline-none" />
        </div>
        </div>
       )}
       {isFoodCategory(editPlace.category) && (
        <div className="bg-gray-50 p-3 rounded-lg">
         <label className="block text-xs font-bold text-gray-500 mb-2">혼밥 별점 (혼자 가도 괜찮은 정도)</label>
         <StarRatingInput value={editPlace.rating||0} onChange={(v) => setEditPlace({...editPlace, rating:v})} />

       {!isFoodCategory(editPlace.category) && (
        <div className="flex gap-1 items-center">
         <input type="number" inputMode="numeric" placeholder="입장료 최소(위안, 선택)" value={editPlace.fee.split('~')[0]||''} onChange={(e) => setEditPlace({...editPlace, fee: e.target.value + '~' + (editPlace.fee.split('~')[1]||'')})} className="w-1/2 bg-gray-50 p-3 rounded-lg text-sm outline-none" />
         <span className="text-gray-400 text-xs">~</span>
         <input type="number" inputMode="numeric" placeholder="입장료 최대(위안, 선택)" value={editPlace.fee.split('~')[1]||''} onChange={(e) => setEditPlace({...editPlace, fee: (editPlace.fee.split('~')[0]||'') + '~' + e.target.value})} className="w-1/2 bg-gray-50 p-3 rounded-lg text-sm outline-none" />
        </div>
       )}
       <div>
        <label className="block text-xs font-bold text-gray-500 mb-2">영업시간 (선택, 버튼 탭 한 번으로 간편 설정)</label>
        <HoursInput from={editPlace.hoursFrom} to={editPlace.hoursTo} onChange={(from, to) => setEditPlace({...editPlace, hoursFrom:from, hoursTo:to})} />
       </div>
       <textarea placeholder="메모 (팁 등)" value={editPlace.memo} onChange={(e) => setEditPlace({...editPlace, memo:e.target.value})} className="w-full bg-gray-50 p-3 rounded-lg text-sm outline-none h-24 resize-none" />
       <div>
        <label className="block text-xs font-bold text-gray-500 mb-2">사진 첨부</label>
        <input type="file" multiple accept="image/*" onChange={handleEditImageUpload} disabled={editUploading} className="text-xs text-gray-500" />
        {editUploading && <p className="text-xs text-gray-400 mt-1">업로드 중...</p>}
        <div className="flex gap-2 mt-2 overflow-x-auto">
         {(editPlace.images||[]).map((img, i) => (
          <div key={i} className="relative flex-shrink-0">
           <img src={img} onClick={() => openLightbox(img)} className="w-16 h-16 object-cover rounded-lg cursor-pointer" />
           <button onClick={() => removeEditImage(i)} className="absolute -top-1 -right-1 bg-black/60 text-white rounded-full w-4 h-4 text-[10px] leading-4">✕</button>
          </div>
         ))}
        </div>
       </div>
       <button onClick={saveEdit} disabled={editUploading} className="w-full brand-gradient text-white p-3 rounded-xl font-bold disabled:opacity-50">저장</button>
      </div>
     ) : (
      <div key={place.id} onClick={() => startEdit(place)} className="bg-white p-4 rounded-2xl card-shadow cursor-pointer active:opacity-80">
       <div className="flex justify-between items-start mb-2">
        <div>
         <span className="text-[10px] bg-gray-100 text-gray-500 px-2 py-1 rounded-md font-bold">{place.category}</span>
         <h4 className="font-bold text-lg mt-1">{place.name}</h4>
         {place.nameCn && <p className="text-xs text-gray-400">{place.nameCn}</p>}
        </div>
        <button onClick={(e) => { e.stopPropagation(); removePlace(place.id); }} className="text-gray-300"><Icons.Trash /></button>
       </div>
       {place.address && <p className="text-xs text-gray-500 mb-2">{place.address}</p>}
       {isFoodCategory(place.category) && (place.menu || place.priceRange) && (
        <div className="bg-orange-50 p-2 rounded-lg text-xs text-orange-800 mb-2">
         {place.menu && <span>🍴 {place.menu} </span>}
         {place.priceRange && <span className="ml-2">💰 {formatCnyRange(place.priceRange)}</span>}
        </div>
       )}
       {isFoodCategory(place.category) && place.rating > 0 && (
        <p className="text-xs text-yellow-500 font-bold mb-2">
         {'★'.repeat(place.rating)}{'☆'.repeat(5-place.rating)} <span className="text-gray-400 font-normal">혼밥 {place.rating}.0</span>
        </p>
       )}
       {place.fee && <p className="text-xs text-gray-600 mb-2">🎟️ 입장료: {formatCnyRange(place.fee)}</p>}
       {(place.hoursFrom || place.hoursTo) && <p className="text-xs text-gray-600 mb-2">🕒 영업시간: {place.hoursFrom||'?'} ~ {place.hoursTo||'?'}</p>}
       {place.memo && <p className="text-sm bg-gray-50 p-2 rounded-lg text-gray-700 whitespace-pre-wrap">{place.memo}</p>}
       {place.images && place.images.length > 0 && (
        <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
         {place.images.map((img, i) => <img key={i} src={img} onClick={(e) => { e.stopPropagation(); openLightbox(img); }} className="w-20 h-20 object-cover rounded-lg flex-shrink-0 cursor-pointer" />)}
        </div>
       )}
      </div>
     )
    ))}
   </div>
  </div>
 );
};

const ShoppingView = ({ data, updateData }) => {
 const [newItem, setNewItem] = useState({ name:'', type:'식품', store:'', feature:'', price:'', image:'', checked:false });
 const types = ['식품','화장품/뷰티','기념품','의류','완구','기타'];
 const filterTypes = ['전체', ...types];
 const [search, setSearch] = useState('');
 const [filter, setFilter] = useState('전체');

 const [uploading, setUploading] = useState(false);
 const handleImage = async (e) => {
  if (!e.target.files[0]) return;
  setUploading(true);
  try {
   const url = await uploadImage(e.target.files[0], 400);
   setNewItem(prev => ({ ...prev, image: url }));
  } catch (err) {
   alert('사진 업로드에 실패했어요. 다시 시도해주세요.');
   console.error(err);
  } finally {
   setUploading(false);
  }
 };

 const addItem = () => {
  if (!newItem.name) return;
  updateData([{ ...newItem, id: generateId() }, ...data]);
  setNewItem({ name:'', type:'식품', store:'', feature:'', price:'', image:'', checked:false });
 };

 const toggleCheck = (id) => updateData(data.map(item => item.id===id ? { ...item, checked:!item.checked } : item));
 const removeItem = (id) => updateData(data.filter(item => item.id !== id));

 const [editingId, setEditingId] = useState(null);
 const [editItem, setEditItem] = useState(null);
 const [editUploading, setEditUploading] = useState(false);
 const startEdit = (item) => { setEditingId(item.id); setEditItem({ ...item }); };
 const cancelEdit = () => { setEditingId(null); setEditItem(null); };
 const saveEdit = () => {
  if (!editItem.name) return;
  updateData(data.map(i => i.id === editingId ? editItem : i));
  setEditingId(null); setEditItem(null);
 };
 const handleEditImage = async (e) => {
  if (!e.target.files[0]) return;
  setEditUploading(true);
  try {
   const url = await uploadImage(e.target.files[0], 400);
   setEditItem(prev => ({ ...prev, image: url }));
  } catch (err) {
   alert('사진 업로드에 실패했어요. 다시 시도해주세요.');
   console.error(err);
  } finally {
   setEditUploading(false);
  }
 };

 const filteredData = data.filter(item => (filter==='전체' || item.type===filter) && (item.name.includes(search) || item.store.includes(search) || item.feature.includes(search)));

 return (
  <div className="space-y-6">
   <div className="bg-white p-4 rounded-2xl card-shadow space-y-3">
    <div className="flex gap-2">
     <select value={newItem.type} onChange={(e) => setNewItem({...newItem, type:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/3">
      {types.map(t => <option key={t} value={t}>{t}</option>)}
     </select>
     <input type="text" placeholder="제품명" value={newItem.name} onChange={(e) => setNewItem({...newItem, name:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none flex-1 font-bold" />
    </div>
    <div className="flex gap-2">
     <input type="text" placeholder="판매처 (예: 까르푸)" value={newItem.store} onChange={(e) => setNewItem({...newItem, store:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
     <input type="text" placeholder="특징/종류" value={newItem.feature} onChange={(e) => setNewItem({...newItem, feature:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
    </div>
    <div className="flex gap-2 items-center">
     <input type="number" inputMode="numeric" placeholder="가격(위안)" value={newItem.price} onChange={(e) => setNewItem({...newItem, price:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
     {newItem.price && <span className="text-xs text-gray-400 w-1/2">≈ {Math.round(Number(newItem.price)*CNY_RATE).toLocaleString()}원</span>}
    </div>
    <div className="flex items-center justify-between">
     <input type="file" accept="image/*" onChange={handleImage} disabled={uploading} className="text-xs text-gray-500 w-1/2" />
     {uploading && <p className="text-xs text-gray-400">업로드 중...</p>}
     <button onClick={addItem} disabled={uploading} className="brand-gradient text-white px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50">{uploading ? '업로드 중' : '추가'}</button>
    </div>
   </div>
   <div className="flex gap-2 bg-white p-2 rounded-xl card-shadow">
    <input type="text" placeholder="아이템 검색..." value={search} onChange={(e) => setSearch(e.target.value)} className="flex-1 px-3 py-2 text-sm outline-none bg-gray-50 rounded-lg" />
   </div>
   <div className="flex gap-2 overflow-x-auto pb-2 -mx-2 px-2">
    {filterTypes.map(t => (
     <button key={t} onClick={() => setFilter(t)} className={`flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold ${filter===t?'bg-theme-text text-white':'bg-white text-gray-500 border'}`}>{t}</button>
    ))}
   </div>
   <div className="space-y-3">
    {filteredData.map(item => (
     editingId === item.id ? (
      <div key={item.id} className="bg-white p-4 rounded-2xl card-shadow space-y-3 border border-theme-accent">
       <div className="flex justify-between items-center">
        <h4 className="font-bold text-sm">아이템 수정</h4>
        <button onClick={cancelEdit} className="text-gray-400 text-xs">취소</button>
       </div>
       <div className="flex gap-2">
        <select value={editItem.type} onChange={(e) => setEditItem({...editItem, type:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/3">
         {types.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <input type="text" placeholder="제품명" value={editItem.name} onChange={(e) => setEditItem({...editItem, name:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none flex-1 font-bold" />
       </div>
       <div className="flex gap-2">
        <input type="text" placeholder="판매처 (예: 까르푸)" value={editItem.store} onChange={(e) => setEditItem({...editItem, store:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
        <input type="text" placeholder="특징/종류" value={editItem.feature} onChange={(e) => setEditItem({...editItem, feature:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
       </div>
       <div className="flex gap-2 items-center">
        <input type="number" inputMode="numeric" placeholder="가격(위안)" value={editItem.price||''} onChange={(e) => setEditItem({...editItem, price:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
        {editItem.price && <span className="text-xs text-gray-400 w-1/2">≈ {Math.round(Number(editItem.price)*CNY_RATE).toLocaleString()}원</span>}
       </div>
       <div className="flex items-center gap-2">
        {editItem.image && <img src={editItem.image} onClick={() => openLightbox(editItem.image)} className="w-12 h-12 rounded-lg object-cover cursor-pointer" />}
        <input type="file" accept="image/*" onChange={handleEditImage} disabled={editUploading} className="text-xs text-gray-500 flex-1" />
       </div>
       {editUploading && <p className="text-xs text-gray-400">업로드 중...</p>}
       <button onClick={saveEdit} disabled={editUploading} className="w-full brand-gradient text-white p-2.5 rounded-xl font-bold text-sm disabled:opacity-50">저장</button>
      </div>
     ) : (
      <div key={item.id} className={`flex items-center gap-3 p-4 rounded-2xl card-shadow transition-colors ${item.checked?'bg-gray-50 opacity-60':'bg-white'}`}>
       <div onClick={() => toggleCheck(item.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer flex-shrink-0 ${item.checked?'bg-green-500 border-green-500 text-white':'border-gray-300'}`}>{item.checked && <Icons.Check />}</div>
       {item.image && <img src={item.image} onClick={() => openLightbox(item.image)} className="w-12 h-12 rounded-lg object-cover cursor-pointer flex-shrink-0" />}
       <div className="flex-1 cursor-pointer" onClick={() => startEdit(item)}>
        <div className="flex items-center gap-2">
         <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">{item.type}</span>
         <h4 className={`font-bold ${item.checked?'line-through':''}`}>{item.name}</h4>
        </div>
        <p className="text-xs text-gray-500 mt-1">{item.store && <span>📍 {item.store} </span>}{item.feature && <span>| 💡 {item.feature} </span>}{item.price && <span>| 💰 {Number(item.price).toLocaleString()}위안 ({Math.round(Number(item.price)*CNY_RATE).toLocaleString()}원)</span>}</p>
       </div>
       <button onClick={() => removeItem(item.id)} className="text-gray-300 p-2"><Icons.Trash /></button>
      </div>
     )
    ))}
   </div>
  </div>
 );
};

const ExpensesView = ({ data, updateData }) => {
 const [cnyRate, setCnyRate] = useState(190);
 const [calcCny, setCalcCny] = useState('');
 const [newExp, setNewExp] = useState({ day:1, desc:'', amountCny:'' });

 const totalSpentCny = data.list.reduce((sum, item) => sum + Number(item.amountCny), 0);
 const budgetRemainsCny = data.budget - totalSpentCny;

 const addExpense = () => {
  if (!newExp.desc || !newExp.amountCny) return;
  updateData({ ...data, list:[{ ...newExp, id: generateId(), date: new Date().toISOString() }, ...data.list] });
  setNewExp({ ...newExp, desc:'', amountCny:'' });
 };

 const removeExpense = (id) => updateData({ ...data, list: data.list.filter(e => e.id !== id) });

 const grouped = data.list.reduce((acc, item) => { acc[item.day] = acc[item.day] || []; acc[item.day].push(item); return acc; }, {});

 return (
  <div className="space-y-6">
   <div className="bg-white p-4 rounded-2xl card-shadow space-y-3 overflow-hidden">
    <div className="flex justify-end items-center gap-1 text-xs text-gray-400 flex-wrap">
     <span>환율 1¥ =</span>
     <input type="number" value={cnyRate} onChange={e=>setCnyRate(Number(e.target.value)||0)} className="w-12 min-w-0 text-right font-bold outline-none border-b border-gray-200 no-spinner" />
     <span>원</span>
    </div>
    <div className="flex gap-2 items-center">
     <div className="flex-1 min-w-0">
      <label className="text-xs font-bold text-gray-400">위안화(CNY)</label>
      <input type="number" value={calcCny} onChange={e=>setCalcCny(e.target.value)} placeholder="0" className="w-full min-w-0 text-xl font-bold outline-none border-b py-1 no-spinner" />
     </div>
     <div className="text-gray-300 text-xl flex-shrink-0">=</div>
     <div className="flex-1 min-w-0 text-right">
      <label className="text-xs font-bold text-gray-400">원화(KRW)</label>
      <div className="text-xl font-bold text-blue-600 py-1 truncate">{Math.round((Number(calcCny)||0)*cnyRate).toLocaleString()}원</div>
     </div>
    </div>
   </div>

   <div className="bg-gray-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
    <div className="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
    <div className="flex justify-between items-end mb-4">
     <div>
      <p className="text-gray-400 text-xs mb-1">남은 예산</p>
      <h2 className="text-3xl font-bold">{budgetRemainsCny.toLocaleString()} <span className="text-lg">¥</span></h2>
      <p className="text-gray-400 text-xs mt-1">총 {(budgetRemainsCny*cnyRate).toLocaleString()}원</p>
     </div>
     <div className="text-right">
      <p className="text-gray-400 text-xs mb-1">총 예산 설정</p>
      <input type="number" value={data.budget} onChange={e => updateData({...data, budget:Number(e.target.value)})} className="bg-transparent text-right border-b border-gray-600 text-lg outline-none w-20 text-white" /> ¥
     </div>
    </div>
    <div className="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
     <div className="bg-blue-400 h-full" style={{ width:`${Math.min(100, Math.max(0, (totalSpentCny/(data.budget||1))*100))}%` }}></div>
    </div>
    <p className="text-right text-[10px] text-gray-400 mt-2">총 지출: {totalSpentCny.toLocaleString()} ¥</p>
   </div>

   <div className="bg-white p-4 rounded-2xl card-shadow flex gap-2 items-center overflow-hidden">
    <select value={newExp.day} onChange={e=>setNewExp({...newExp, day:Number(e.target.value)})} className="bg-gray-50 p-2 rounded-lg text-sm outline-none flex-shrink-0 w-16">
     {[1,2,3,4,5,6,7].map(d => <option key={d} value={d}>{d}일차</option>)}
    </select>
    <input type="text" placeholder="어디에 썼나요?" value={newExp.desc} onChange={e=>setNewExp({...newExp, desc:e.target.value})} className="flex-1 min-w-0 bg-gray-50 p-2 rounded-lg text-sm outline-none" />
    <input type="number" placeholder="금액(¥)" value={newExp.amountCny} onChange={e=>setNewExp({...newExp, amountCny:e.target.value})} className="w-16 min-w-0 bg-gray-50 p-2 rounded-lg text-sm outline-none no-spinner flex-shrink-0" />
    <button onClick={addExpense} className="brand-gradient text-white px-3 py-2 rounded-lg flex-shrink-0"><Icons.Plus /></button>
   </div>

   <div className="space-y-4">
    {Object.keys(grouped).sort((a,b)=>b-a).map(day => {
     const dayTotal = grouped[day].reduce((sum, item) => sum + Number(item.amountCny), 0);
     return (
      <div key={day} className="bg-white rounded-2xl card-shadow p-4">
       <div className="flex justify-between items-center mb-3 border-b pb-2">
        <h4 className="font-bold">{day}일차 지출</h4>
        <span className="font-bold text-blue-600">{dayTotal.toLocaleString()} ¥</span>
       </div>
       <div className="space-y-2">
        {grouped[day].map(item => (
         <div key={item.id} className="flex justify-between items-center text-sm">
          <span className="text-gray-700">{item.desc}</span>
          <div className="flex items-center gap-3">
           <span className="font-bold">{Number(item.amountCny).toLocaleString()} ¥</span>
           <button onClick={() => removeExpense(item.id)} className="text-gray-300"><Icons.Trash /></button>
          </div>
         </div>
        ))}
       </div>
      </div>
     );
    })}
   </div>
  </div>
 );
};

const ChecklistSection = ({ title, emoji, data, updateData }) => {
 const [newTodo, setNewTodo] = useState('');

 const addTodo = (e) => {
  e.preventDefault();
  if (!newTodo.trim()) return;
  updateData([{ id: generateId(), text:newTodo, checked:false }, ...data]);
  setNewTodo('');
 };

 const toggleTodo = (id) => updateData(data.map(item => item.id===id ? { ...item, checked:!item.checked } : item));
 const removeTodo = (id) => updateData(data.filter(item => item.id !== id));

 const checkedCount = data.filter(d => d.checked).length;
 const progress = data.length === 0 ? 0 : Math.round((checkedCount/data.length)*100);

 return (
  <div className="space-y-4">
   <div className="brand-gradient text-white p-5 rounded-2xl shadow-md">
    <h2 className="font-bold mb-2">{title} {emoji}</h2>
    <div className="w-full bg-gray-600 h-2 rounded-full overflow-hidden mb-2">
     <div className="h-full transition-all duration-500 bg-gradient-to-r from-teal-300 to-blue-400" style={{ width:`${progress}%` }}></div>
    </div>
    <p className="text-xs text-gray-300 text-right">{progress}% 완료</p>
   </div>
   <form onSubmit={addTodo} className="flex gap-2">
    <input type="text" value={newTodo} onChange={(e)=>setNewTodo(e.target.value)} placeholder="항목 입력..." className="flex-1 bg-white p-3 rounded-xl card-shadow outline-none text-sm" />
    <button type="submit" className="brand-gradient text-white px-5 rounded-xl font-bold shadow-md">추가</button>
   </form>
   <div className="bg-white rounded-2xl card-shadow overflow-hidden">
    {data.map(item => (
     <div key={item.id} className="flex items-center gap-3 p-4 border-b border-gray-50 last:border-0">
      <div onClick={() => toggleTodo(item.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer transition-colors ${item.checked?'bg-green-500 border-green-500 text-white':'border-gray-300'}`}>{item.checked && <Icons.Check />}</div>
      <span onClick={() => toggleTodo(item.id)} className={`flex-1 text-sm cursor-pointer ${item.checked?'text-gray-400 line-through':'text-gray-800'}`}>{item.text}</span>
      <button onClick={() => removeTodo(item.id)} className="text-gray-300 p-1"><Icons.Trash /></button>
     </div>
    ))}
   </div>
  </div>
 );
};

const ChecklistView = ({ data, updateData }) => {
 const [sub, setSub] = useState('packing');
 const safeData = data && typeof data === 'object' && !Array.isArray(data) ? data : { packing: [], prep: [] };
 return (
  <div className="space-y-4">
   <div className="flex gap-2 bg-gray-100 p-1 rounded-xl">
    <button onClick={() => setSub('packing')} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-colors ${sub==='packing'?'bg-white shadow brand-gradient-text':'text-gray-400'}`}>짐 챙기기 🧳</button>
    <button onClick={() => setSub('prep')} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-colors ${sub==='prep'?'bg-white shadow brand-gradient-text':'text-gray-400'}`}>사전 준비 📋</button>
   </div>
   {sub==='packing'
    ? <ChecklistSection title="짐 챙기기 체크" emoji="🧳" data={safeData.packing} updateData={(d) => updateData({ ...safeData, packing:d })} />
    : <ChecklistSection title="사전 준비 체크" emoji="📋" data={safeData.prep} updateData={(d) => updateData({ ...safeData, prep:d })} />}
  </div>
 );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
