const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

window.storage = {
  get: async (key) => {
    const snap = await getDoc(doc(db, 'trip', key));
    if (!snap.exists()) throw new Error('not found');
    return { value: snap.data().value };
  },
  set: async (key, value) => {

<script type="text/babel">
const { useState, useEffect } = React;

const Icons = {
 Map: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>,
 Star: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>,
 Bag: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>,
 Wallet: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>,
 Check: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
 Settings: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
 Plus: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
 Sparkles: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>,
 Trash: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
};

const resizeImage = (file, maxWidth=800) => new Promise((resolve) => {
 const reader = new FileReader();
 reader.readAsDataURL(file);
 reader.onload = (event) => {
  const img = new Image();
  img.src = event.target.result;
  img.onload = () => {
   const canvas = document.createElement('canvas');
   const ratio = maxWidth / img.width;
   canvas.width = maxWidth;
   canvas.height = img.height * (ratio > 1 ? 1 : ratio);
   canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
   resolve(canvas.toDataURL('image/jpeg', 0.6));
  };
 };
});

const generateId = () => Math.random().toString(36).substring(2, 9);

const useLongPress = (callback, ms=700) => {
 const [start, setStart] = useState(false);
 useEffect(() => {
  let t;
  if (start) t = setTimeout(callback, ms); else clearTimeout(t);
  return () => clearTimeout(t);
 }, [callback, ms, start]);
 return {
  onTouchStart: () => setStart(true), onTouchEnd: () => setStart(false), onTouchMove: () => setStart(false),
  onMouseDown: () => setStart(true), onMouseUp: () => setStart(false), onMouseLeave: () => setStart(false),
 };
};

const DEFAULT_DATA = {
 itinerary: { hotelName:'', hotelAddress:'', days:[{ id: generateId(), label:'1일차', destinations:[] }] },
 places: [], shopping: [], expenses: { budget:0, list:[] },
 checklist: [
  { id: generateId(), text:'여권 챙기기', checked:false },
  { id: generateId(), text:'비자 확인', checked:false },
  { id: generateId(), text:'환전/알리페이 세팅', checked:false }
 ]
};

const App = () => {
 const [loading, setLoading] = useState(true);
 const [activeTab, setActiveTab] = useState('itinerary');
 const [data, setData] = useState(DEFAULT_DATA);
 const [showSettings, setShowSettings] = useState(false);
 const [geminiKey, setGeminiKey] = useState('');
 const [pull, setPull] = useState(0);
 const [refreshing, setRefreshing] = useState(false);
 const touchStartY = React.useRef(null);

 const onTouchStart = (e) => { if (window.scrollY <= 0) touchStartY.current = e.touches[0].clientY; };
 const onTouchMove = (e) => {
  if (touchStartY.current === null) return;
  const diff = e.touches[0].clientY - touchStartY.current;
  if (diff > 0 && window.scrollY <= 0) setPull(Math.min(diff, 100));
 };
 const onTouchEnd = () => {
  if (pull > 60) { setRefreshing(true); setTimeout(() => window.location.reload(), 300); }
  else setPull(0);
  touchStartY.current = null;
 };

 useEffect(() => {
  (async () => {
   try {
    const saved = await window.storage.get('trip-data');
    if (saved) setData(JSON.parse(saved.value));
    const key = await window.storage.get('gemini-key');
    if (key) setGeminiKey(key.value);
   } catch (e) { /* no saved data yet */ }
   setLoading(false);
  })();
 }, []);

 const updateData = async (key, newData) => {
  const updated = { ...data, [key]: newData };
  setData(updated);
  try { await window.storage.set('trip-data', JSON.stringify(updated)); } catch (e) { console.error(e); }
 };

 const saveApiKey = async (e) => {
  setGeminiKey(e.target.value);
  try { await window.storage.set('gemini-key', e.target.value); } catch (err) { console.error(err); }
 };

 if (loading) return <div className="flex h-screen items-center justify-center text-theme-primary">로딩중...</div>;

 return (
  <div className="min-h-screen pb-[90px] max-w-2xl mx-auto flex flex-col relative" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} style={{ transform: pull ? `translateY(${pull}px)` : 'none', transition: touchStartY.current ? 'none' : 'transform .25s' }}>
   {(pull > 0 || refreshing) && (
    <div className="absolute -top-10 left-0 right-0 flex justify-center items-center h-10 text-theme-primary text-xs font-bold">
     {refreshing ? '새로고침 중...' : (pull > 60 ? '놓으면 새로고침' : '당겨서 새로고침')}
    </div>
   )}
   <header className="px-6 pt-12 pb-4 flex justify-between items-center bg-theme-bg sticky top-0 z-10">
    <h1 className="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-gray-900 to-gray-500 bg-clip-text text-transparent">대련 여행 ✈️</h1>
    <button onClick={() => setShowSettings(!showSettings)} className="text-theme-primary p-2 opacity-50 hover:opacity-100"><Icons.Settings /></button>
   </header>

   {showSettings && (
    <div className="absolute top-24 right-6 bg-white p-4 rounded-xl card-shadow border border-gray-100 z-20 w-64">
     <label className="block text-xs font-bold text-gray-500 mb-2">Gemini API Key (AI 길찾기용)</label>
     <input type="password" value={geminiKey} onChange={saveApiKey} placeholder="AI Studio 키 입력" className="w-full text-sm p-2 bg-gray-50 rounded outline-none border focus:border-theme-accent" />
     <p className="text-[10px] text-gray-400 mt-2">* 이 기기 세션에만 저장됩니다.</p>
    </div>
   )}

   <main className="flex-1 px-4">
    {activeTab === 'itinerary' && <ItineraryView data={data.itinerary} updateData={(d) => updateData('itinerary', d)} apiKey={geminiKey} />}
    {activeTab === 'places' && <PlacesView data={data.places} updateData={(d) => updateData('places', d)} />}
    {activeTab === 'shopping' && <ShoppingView data={data.shopping} updateData={(d) => updateData('shopping', d)} />}
    {activeTab === 'expenses' && <ExpensesView data={data.expenses} updateData={(d) => updateData('expenses', d)} />}
    {activeTab === 'checklist' && <ChecklistView data={data.checklist} updateData={(d) => updateData('checklist', d)} />}
   </main>

   <nav className="fixed bottom-0 w-full max-w-2xl glass-nav border-t border-gray-100 pb-safe pt-2 px-2 z-50">
    <ul className="flex justify-around items-center">
     {[
      { id:'itinerary', icon:Icons.Map, label:'일정표' },
      { id:'places', icon:Icons.Star, label:'가고싶은곳' },
      { id:'shopping', icon:Icons.Bag, label:'살것' },
      { id:'expenses', icon:Icons.Wallet, label:'지출' },
      { id:'checklist', icon:Icons.Check, label:'체크' },
     ].map(tab => (
      <li key={tab.id} className="flex-1">
       <button onClick={() => setActiveTab(tab.id)} className={`w-full flex flex-col items-center py-2 transition-colors duration-200 ${activeTab===tab.id?'text-theme-text font-bold':'text-gray-400'}`}>
        <div className={`${activeTab===tab.id?'scale-110 mb-1 text-theme-accent':'scale-100 mb-1'} transition-transform`}><tab.icon /></div>
        <span className="text-[10px]">{tab.label}</span>
       </button>
      </li>
     ))}
    </ul>
   </nav>
  </div>
 );
};

const ItineraryView = ({ data, updateData, apiKey }) => {
 const [activeDayIdx, setActiveDayIdx] = useState(0);
 const [loadingAI, setLoadingAI] = useState(false);
 const activeDay = data.days[activeDayIdx];

 const addDay = () => {
  const newDays = [...data.days, { id: generateId(), label:`${data.days.length+1}일차`, destinations:[] }];
  updateData({ ...data, days:newDays });
  setActiveDayIdx(newDays.length - 1);
 };

 const deleteDay = (idx) => {
  if (data.days.length <= 1) return alert("최소 1개의 일차가 필요합니다.");
  if (confirm(`${data.days[idx].label} 일정을 삭제하시겠습니까?`)) {
   const newDays = data.days.filter((_, i) => i !== idx);
   newDays.forEach((day, i) => day.label = `${i+1}일차`);
   updateData({ ...data, days:newDays });
   setActiveDayIdx(Math.max(0, idx-1));
  }
 };

 const addDestination = () => {
  const newDays = [...data.days];
  newDays[activeDayIdx].destinations.push({ id: generateId(), name:'', address:'', aiPrediction:'' });
  updateData({ ...data, days:newDays });
 };

 const updateDestination = (destId, field, value) => {
  const newDays = [...data.days];
  const dest = newDays[activeDayIdx].destinations.find(d => d.id === destId);
  if (dest) dest[field] = value;
  updateData({ ...data, days:newDays });
 };

 const removeDestination = (destId) => {
  const newDays = [...data.days];
  newDays[activeDayIdx].destinations = newDays[activeDayIdx].destinations.filter(d => d.id !== destId);
  updateData({ ...data, days:newDays });
 };

 const predictTravel = async (destId) => {
  if (!apiKey) return alert("우측 상단 톱니바퀴에서 AI(Gemini) API 키를 먼저 입력해주세요.");
  if (!data.hotelAddress) return alert("호텔 주소를 먼저 입력해주세요.");
  const dest = activeDay.destinations.find(d => d.id === destId);
  if (!dest || !dest.address) return alert("목적지 주소를 입력해주세요.");
  setLoadingAI(destId);
  try {
   const prompt = `호텔 주소: ${data.hotelAddress}, 목적지 주소: ${dest.address}. 중국 대련(Dalian) 여행 중입니다. 이 두 장소 간 택시나 대중교통 이용 시 대략적인 소요 시간과 예상 비용(위안화)을 1~2줄로 짧게 예측해서 알려주세요.`;
   const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
   });
   const result = await response.json();
   const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "예측 실패. 주소를 구체적으로 적어보세요.";
   updateDestination(destId, 'aiPrediction', text);
  } catch (e) { alert("AI 예측 중 오류가 발생했습니다. API 키를 확인해주세요."); }
  setLoadingAI(false);
 };

 return (
  <div className="space-y-6">
   <div className="bg-white p-5 rounded-2xl card-shadow">
    <h2 className="text-sm font-bold text-gray-500 mb-3 flex items-center gap-2"><Icons.Map /> 베이스캠프 (호텔)</h2>
    <input type="text" placeholder="호텔 이름 (예: 콘래드 대련)" value={data.hotelName} onChange={(e) => updateData({ ...data, hotelName:e.target.value })} className="w-full bg-gray-50 p-3 rounded-lg mb-2 text-sm outline-none focus:bg-gray-100 transition-colors" />
    <input type="text" placeholder="호텔 주소 (AI 길찾기 기준점)" value={data.hotelAddress} onChange={(e) => updateData({ ...data, hotelAddress:e.target.value })} className="w-full bg-gray-50 p-3 rounded-lg text-sm outline-none focus:bg-gray-100 transition-colors" />
   </div>

   <div className="flex gap-2 overflow-x-auto pb-2 -mx-2 px-2">
    {data.days.map((day, idx) => (
     <DayTab key={day.id} day={day} idx={idx} isActive={idx===activeDayIdx} onClick={() => setActiveDayIdx(idx)} onDelete={() => deleteDay(idx)} />
    ))}
    <button onClick={addDay} className="flex-shrink-0 px-4 py-2 rounded-full bg-gray-100 text-gray-500 font-medium text-sm flex items-center"><Icons.Plus /> 추가</button>
   </div>

   <div className="space-y-4">
    {activeDay.destinations.map((dest, index) => (
     <div key={dest.id} className="bg-white p-4 rounded-2xl card-shadow relative">
      <button onClick={() => removeDestination(dest.id)} className="absolute top-4 right-4 text-gray-300 hover:text-red-400"><Icons.Trash /></button>
      <div className="flex items-center gap-3 mb-3">
       <div className="w-6 h-6 rounded-full bg-theme-text text-white flex items-center justify-center text-xs font-bold">{index+1}</div>
       <input type="text" placeholder="장소명" value={dest.name} onChange={(e) => updateDestination(dest.id, 'name', e.target.value)} className="font-bold text-lg outline-none w-3/4" />
      </div>
      <input type="text" placeholder="주소 (AI 예측용)" value={dest.address} onChange={(e) => updateDestination(dest.id, 'address', e.target.value)} className="w-full text-sm text-gray-600 bg-gray-50 p-2 rounded mb-3 outline-none" />
      {dest.aiPrediction && <div className="bg-blue-50/50 border border-blue-100 p-3 rounded-lg text-xs text-gray-700 mb-3 leading-relaxed">✨ {dest.aiPrediction}</div>}
      <button onClick={() => predictTravel(dest.id)} disabled={loadingAI===dest.id} className="w-full py-2 bg-gray-50 hover:bg-gray-100 text-gray-600 text-xs font-bold rounded-lg flex items-center justify-center gap-1 transition-colors">
       {loadingAI===dest.id ? '예측 중...' : <><Icons.Sparkles /> 호텔에서 여기까지 소요시간/비용 예측 (AI)</>}
      </button>
     </div>
    ))}
    <button onClick={addDestination} className="w-full py-4 border-2 border-dashed border-gray-200 rounded-2xl text-gray-400 font-bold flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors"><Icons.Plus /> 장소 추가하기</button>
   </div>
  </div>
 );
};

const DayTab = ({ day, idx, isActive, onClick, onDelete }) => {
 const longPressProps = useLongPress(() => onDelete(idx), 800);
 return (
  <button {...longPressProps} onClick={onClick} className={`flex-shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all select-none ${isActive?'bg-theme-text text-white shadow-md':'bg-white text-gray-400 border border-gray-100'}`}>
   {day.label}
  </button>
 );
};

const PlacesView = ({ data, updateData }) => {
 const [search, setSearch] = useState('');
 const [filter, setFilter] = useState('전체');
 const [showForm, setShowForm] = useState(false);
 const categories = ['전체','음식점','카페','관광지','쇼핑','기타'];
 const [newPlace, setNewPlace] = useState({ name:'', category:'관광지', address:'', memo:'', fee:'', menu:'', priceRange:'', images:[] });

 const handleImageUpload = async (e) => {
  const files = Array.from(e.target.files);
  const resized = await Promise.all(files.map(f => resizeImage(f, 600)));
  setNewPlace(prev => ({ ...prev, images:[...prev.images, ...resized] }));
 };

 const addPlace = () => {
  if (!newPlace.name) return alert('장소명을 입력하세요.');
  updateData([{ ...newPlace, id: generateId() }, ...data]);
  setNewPlace({ name:'', category:'관광지', address:'', memo:'', fee:'', menu:'', priceRange:'', images:[] });
  setShowForm(false);
 };

 const removePlace = (id) => { if (confirm("삭제하시겠습니까?")) updateData(data.filter(p => p.id !== id)); };

 const filteredData = data.filter(p => (filter==='전체' || p.category===filter) && (p.name.includes(search) || p.memo.includes(search)));

 return (
  <div className="space-y-4">
   <div className="flex gap-2 bg-white p-2 rounded-xl card-shadow">
    <input type="text" placeholder="장소 검색..." value={search} onChange={(e) => setSearch(e.target.value)} className="flex-1 px-3 py-2 text-sm outline-none bg-gray-50 rounded-lg" />
   </div>
   <div className="flex gap-2 overflow-x-auto pb-2 -mx-2 px-2">
    {categories.map(c => (
     <button key={c} onClick={() => setFilter(c)} className={`flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold ${filter===c?'bg-theme-text text-white':'bg-white text-gray-500 border'}`}>{c}</button>
    ))}
   </div>

   {!showForm ? (
    <button onClick={() => setShowForm(true)} className="w-full py-4 bg-theme-text text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-md"><Icons.Plus /> 새로운 장소 등록</button>
   ) : (
    <div className="bg-white p-5 rounded-2xl card-shadow space-y-4 border border-gray-100">
     <div className="flex justify-between items-center mb-2">
      <h3 className="font-bold">장소 등록</h3>
      <button onClick={() => setShowForm(false)} className="text-gray-400 text-sm">취소</button>
     </div>
     <div className="flex gap-2">
      <select value={categories.includes(newPlace.category)?newPlace.category:'직접입력'} onChange={(e) => setNewPlace({...newPlace, category: e.target.value==='직접입력'?'':e.target.value})} className="bg-gray-50 p-3 rounded-lg text-sm outline-none w-1/2">
       {categories.filter(c=>c!=='전체').map(c => <option key={c} value={c}>{c}</option>)}
       <option value="직접입력">직접입력</option>
      </select>
      {!categories.includes(newPlace.category) && (
       <input type="text" placeholder="카테고리 직접 입력" value={newPlace.category} onChange={(e) => setNewPlace({...newPlace, category:e.target.value})} className="flex-1 bg-gray-50 p-3 rounded-lg text-sm outline-none" />
      )}
     </div>
     <input type="text" placeholder="장소명 (필수)" value={newPlace.name} onChange={(e) => setNewPlace({...newPlace, name:e.target.value})} className="w-full bg-gray-50 p-3 rounded-lg text-sm outline-none font-bold" />
     <input type="text" placeholder="주소" value={newPlace.address} onChange={(e) => setNewPlace({...newPlace, address:e.target.value})} className="w-full bg-gray-50 p-3 rounded-lg text-sm outline-none" />
     {newPlace.category==='음식점' && (
      <div className="flex gap-2">
       <input type="text" placeholder="메인 메뉴" value={newPlace.menu} onChange={(e) => setNewPlace({...newPlace, menu:e.target.value})} className="flex-1 bg-gray-50 p-3 rounded-lg text-sm outline-none" />
       <input type="text" placeholder="예상 금액대" value={newPlace.priceRange} onChange={(e) => setNewPlace({...newPlace, priceRange:e.target.value})} className="flex-1 bg-gray-50 p-3 rounded-lg text-sm outline-none" />
      </div>
     )}
     <input type="text" placeholder="입장료 (선택)" value={newPlace.fee} onChange={(e) => setNewPlace({...newPlace, fee:e.target.value})} className="w-full bg-gray-50 p-3 rounded-lg text-sm outline-none" />
     <textarea placeholder="메모 (영업시간, 팁 등)" value={newPlace.memo} onChange={(e) => setNewPlace({...newPlace, memo:e.target.value})} className="w-full bg-gray-50 p-3 rounded-lg text-sm outline-none h-24 resize-none" />
     <div>
      <label className="block text-xs font-bold text-gray-500 mb-2">사진 첨부</label>
      <input type="file" multiple accept="image/*" onChange={handleImageUpload} className="text-xs text-gray-500" />
      <div className="flex gap-2 mt-2 overflow-x-auto">
       {newPlace.images.map((img, i) => <img key={i} src={img} className="w-16 h-16 object-cover rounded-lg" />)}
      </div>
     </div>
     <button onClick={addPlace} className="w-full bg-theme-text text-white p-3 rounded-xl font-bold">저장하기</button>
    </div>
   )}

   <div className="grid grid-cols-1 gap-4 mt-4">
    {filteredData.map(place => (
     <div key={place.id} className="bg-white p-4 rounded-2xl card-shadow">
      <div className="flex justify-between items-start mb-2">
       <div>
        <span className="text-[10px] bg-gray-100 text-gray-500 px-2 py-1 rounded-md font-bold">{place.category}</span>
        <h4 className="font-bold text-lg mt-1">{place.name}</h4>
       </div>
       <button onClick={() => removePlace(place.id)} className="text-gray-300"><Icons.Trash /></button>
      </div>
      {place.address && <p className="text-xs text-gray-500 mb-2">{place.address}</p>}
      {place.category==='음식점' && (place.menu || place.priceRange) && (
       <div className="bg-orange-50 p-2 rounded-lg text-xs text-orange-800 mb-2">
        {place.menu && <span>🍴 {place.menu} </span>}
        {place.priceRange && <span className="ml-2">💰 {place.priceRange}</span>}
       </div>
      )}
      {place.fee && <p className="text-xs text-gray-600 mb-2">🎟️ 입장료: {place.fee}</p>}
      {place.memo && <p className="text-sm bg-gray-50 p-2 rounded-lg text-gray-700 whitespace-pre-wrap">{place.memo}</p>}
      {place.images && place.images.length > 0 && (
       <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
        {place.images.map((img, i) => <img key={i} src={img} className="w-20 h-20 object-cover rounded-lg flex-shrink-0" />)}
       </div>
      )}
     </div>
    ))}
   </div>
  </div>
 );
};

const ShoppingView = ({ data, updateData }) => {
 const [newItem, setNewItem] = useState({ name:'', type:'과자/식품', store:'', feature:'', image:'', checked:false });
 const types = ['과자/식품','화장품/뷰티','기념품','의류','기타'];

 const handleImage = async (e) => {
  if (e.target.files[0]) { const img = await resizeImage(e.target.files[0], 400); setNewItem({...newItem, image:img}); }
 };

 const addItem = () => {
  if (!newItem.name) return;
  updateData([{ ...newItem, id: generateId() }, ...data]);
  setNewItem({ name:'', type:'과자/식품', store:'', feature:'', image:'', checked:false });
 };

 const toggleCheck = (id) => updateData(data.map(item => item.id===id ? { ...item, checked:!item.checked } : item));
 const removeItem = (id) => updateData(data.filter(item => item.id !== id));

 return (
  <div className="space-y-6">
   <div className="bg-white p-4 rounded-2xl card-shadow space-y-3">
    <div className="flex gap-2">
     <select value={newItem.type} onChange={(e) => setNewItem({...newItem, type:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/3">
      {types.map(t => <option key={t} value={t}>{t}</option>)}
     </select>
     <input type="text" placeholder="제품명" value={newItem.name} onChange={(e) => setNewItem({...newItem, name:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none flex-1 font-bold" />
    </div>
    <div className="flex gap-2">
     <input type="text" placeholder="판매처 (예: 까르푸)" value={newItem.store} onChange={(e) => setNewItem({...newItem, store:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
     <input type="text" placeholder="특징/종류" value={newItem.feature} onChange={(e) => setNewItem({...newItem, feature:e.target.value})} className="bg-gray-50 text-sm p-2 rounded-lg outline-none w-1/2" />
    </div>
    <div className="flex items-center justify-between">
     <input type="file" accept="image/*" onChange={handleImage} className="text-xs text-gray-500 w-1/2" />
     <button onClick={addItem} className="bg-theme-text text-white px-4 py-2 rounded-lg text-sm font-bold">추가</button>
    </div>
   </div>
   <div className="space-y-3">
    {data.map(item => (
     <div key={item.id} className={`flex items-center gap-3 p-4 rounded-2xl card-shadow transition-colors ${item.checked?'bg-gray-50 opacity-60':'bg-white'}`}>
      <div onClick={() => toggleCheck(item.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer ${item.checked?'bg-green-500 border-green-500 text-white':'border-gray-300'}`}>{item.checked && <Icons.Check />}</div>
      {item.image && <img src={item.image} className="w-12 h-12 rounded-lg object-cover" />}
      <div className="flex-1" onClick={() => toggleCheck(item.id)}>
       <div className="flex items-center gap-2">
        <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">{item.type}</span>
        <h4 className={`font-bold ${item.checked?'line-through':''}`}>{item.name}</h4>
       </div>
       <p className="text-xs text-gray-500 mt-1">{item.store && <span>📍 {item.store} </span>}{item.feature && <span>| 💡 {item.feature}</span>}</p>
      </div>
      <button onClick={() => removeItem(item.id)} className="text-gray-300 p-2"><Icons.Trash /></button>
     </div>
    ))}
   </div>
  </div>
 );
};

const ExpensesView = ({ data, updateData }) => {
 const [cnyRate, setCnyRate] = useState(190);
 const [calcCny, setCalcCny] = useState('');
 const [newExp, setNewExp] = useState({ day:1, desc:'', amountCny:'' });

 const totalSpentCny = data.list.reduce((sum, item) => sum + Number(item.amountCny), 0);
 const budgetRemainsCny = data.budget - totalSpentCny;

 const addExpense = () => {
  if (!newExp.desc || !newExp.amountCny) return;
  updateData({ ...data, list:[{ ...newExp, id: generateId(), date: new Date().toISOString() }, ...data.list] });
  setNewExp({ ...newExp, desc:'', amountCny:'' });
 };

 const removeExpense = (id) => updateData({ ...data, list: data.list.filter(e => e.id !== id) });

 const grouped = data.list.reduce((acc, item) => { acc[item.day] = acc[item.day] || []; acc[item.day].push(item); return acc; }, {});

 return (
  <div className="space-y-6">
   <div className="bg-white p-4 rounded-2xl card-shadow space-y-3">
    <div className="flex justify-end items-center gap-1 text-xs text-gray-400">
     <span>환율 1¥ =</span>
     <input type="number" value={cnyRate} onChange={e=>setCnyRate(Number(e.target.value)||0)} className="w-14 text-right font-bold outline-none border-b border-gray-200" />
     <span>원</span>
    </div>
    <div className="flex gap-4 items-center">
     <div className="flex-1">
      <label className="text-xs font-bold text-gray-400">위안화(CNY)</label>
      <input type="number" value={calcCny} onChange={e=>setCalcCny(e.target.value)} placeholder="0" className="w-full text-xl font-bold outline-none border-b py-1" />
     </div>
     <div className="text-gray-300 text-2xl">=</div>
     <div className="flex-1 text-right">
      <label className="text-xs font-bold text-gray-400">원화(KRW)</label>
      <div className="text-xl font-bold text-blue-600 py-1">{Math.round((Number(calcCny)||0)*cnyRate).toLocaleString()}원</div>
     </div>
    </div>
   </div>

   <div className="bg-gray-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
    <div className="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
    <div className="flex justify-between items-end mb-4">
     <div>
      <p className="text-gray-400 text-xs mb-1">남은 예산</p>
      <h2 className="text-3xl font-bold">{budgetRemainsCny.toLocaleString()} <span className="text-lg">¥</span></h2>
      <p className="text-gray-400 text-xs mt-1">총 {(budgetRemainsCny*cnyRate).toLocaleString()}원</p>
     </div>
     <div className="text-right">
      <p className="text-gray-400 text-xs mb-1">총 예산 설정</p>
      <input type="number" value={data.budget} onChange={e => updateData({...data, budget:Number(e.target.value)})} className="bg-transparent text-right border-b border-gray-600 text-lg outline-none w-20 text-white" /> ¥
     </div>
    </div>
    <div className="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
     <div className="bg-blue-400 h-full" style={{ width:`${Math.min(100, Math.max(0, (totalSpentCny/(data.budget||1))*100))}%` }}></div>
    </div>
    <p className="text-right text-[10px] text-gray-400 mt-2">총 지출: {totalSpentCny.toLocaleString()} ¥</p>
   </div>

   <div className="bg-white p-4 rounded-2xl card-shadow flex gap-2">
    <select value={newExp.day} onChange={e=>setNewExp({...newExp, day:Number(e.target.value)})} className="bg-gray-50 p-2 rounded-lg text-sm outline-none">
     {[1,2,3,4,5,6,7].map(d => <option key={d} value={d}>{d}일차</option>)}
    </select>
    <input type="text" placeholder="어디에 썼나요?" value={newExp.desc} onChange={e=>setNewExp({...newExp, desc:e.target.value})} className="flex-1 bg-gray-50 p-2 rounded-lg text-sm outline-none" />
    <input type="number" placeholder="금액(¥)" value={newExp.amountCny} onChange={e=>setNewExp({...newExp, amountCny:e.target.value})} className="w-20 bg-gray-50 p-2 rounded-lg text-sm outline-none" />
    <button onClick={addExpense} className="bg-theme-text text-white px-3 rounded-lg"><Icons.Plus /></button>
   </div>

   <div className="space-y-4">
    {Object.keys(grouped).sort((a,b)=>b-a).map(day => {
     const dayTotal = grouped[day].reduce((sum, item) => sum + Number(item.amountCny), 0);
     return (
      <div key={day} className="bg-white rounded-2xl card-shadow p-4">
       <div className="flex justify-between items-center mb-3 border-b pb-2">
        <h4 className="font-bold">{day}일차 지출</h4>
        <span className="font-bold text-blue-600">{dayTotal.toLocaleString()} ¥</span>
       </div>
       <div className="space-y-2">
        {grouped[day].map(item => (
         <div key={item.id} className="flex justify-between items-center text-sm">
          <span className="text-gray-700">{item.desc}</span>
          <div className="flex items-center gap-3">
           <span className="font-bold">{Number(item.amountCny).toLocaleString()} ¥</span>
           <button onClick={() => removeExpense(item.id)} className="text-gray-300"><Icons.Trash /></button>
          </div>
         </div>
        ))}
       </div>
      </div>
     );
    })}
   </div>
  </div>
 );
};

const ChecklistView = ({ data, updateData }) => {
 const [newTodo, setNewTodo] = useState('');

 const addTodo = (e) => {
  e.preventDefault();
  if (!newTodo.trim()) return;
  updateData([{ id: generateId(), text:newTodo, checked:false }, ...data]);
  setNewTodo('');
 };

 const toggleTodo = (id) => updateData(data.map(item => item.id===id ? { ...item, checked:!item.checked } : item));
 const removeTodo = (id) => updateData(data.filter(item => item.id !== id));

 const checkedCount = data.filter(d => d.checked).length;
 const progress = data.length === 0 ? 0 : Math.round((checkedCount/data.length)*100);

 return (
  <div className="space-y-6">
   <div className="bg-theme-text text-white p-5 rounded-2xl shadow-md">
    <h2 className="font-bold mb-2">출발 전 짐싸기 체크 🧳</h2>
    <div className="w-full bg-gray-600 h-2 rounded-full overflow-hidden mb-2">
     <div className="bg-green-400 h-full transition-all duration-500" style={{ width:`${progress}%` }}></div>
    </div>
    <p className="text-xs text-gray-300 text-right">{progress}% 완료</p>
   </div>
   <form onSubmit={addTodo} className="flex gap-2">
    <input type="text" value={newTodo} onChange={(e)=>setNewTodo(e.target.value)} placeholder="준비물 입력..." className="flex-1 bg-white p-3 rounded-xl card-shadow outline-none text-sm" />
    <button type="submit" className="bg-theme-text text-white px-5 rounded-xl font-bold shadow-md">추가</button>
   </form>
   <div className="bg-white rounded-2xl card-shadow overflow-hidden">
    {data.map(item => (
     <div key={item.id} className="flex items-center gap-3 p-4 border-b border-gray-50 last:border-0">
      <div onClick={() => toggleTodo(item.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer transition-colors ${item.checked?'bg-green-500 border-green-500 text-white':'border-gray-300'}`}>{item.checked && <Icons.Check />}</div>
      <span onClick={() => toggleTodo(item.id)} className={`flex-1 text-sm cursor-pointer ${item.checked?'text-gray-400 line-through':'text-gray-800'}`}>{item.text}</span>
      <button onClick={() => removeTodo(item.id)} className="text-gray-300 p-1"><Icons.Trash /></button>
     </div>
    ))}
   </div>
  </div>
 );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
